name: Build Android mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'mod.json'
      - 'CMakeLists.txt'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Save mod
        uses: actions/upload-artifact@v4
        with:
          name: amnyam-dec-android
          path: ${{ steps.build.outputs.build-output }}/*.geode
