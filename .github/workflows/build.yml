
name: Build Android mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'mod.json'
      - 'CMakeLists.txt'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: android64
